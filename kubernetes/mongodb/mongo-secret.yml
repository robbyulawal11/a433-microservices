# Secret: menyimpan kredensial MongoDB dalam bentuk base64
# agar tidak tertulis sebagai teks biasa di manifest lain.
apiVersion: v1               # Versi API Kubernetes untuk object Secret
kind: Secret                 # Jenis object yang dibuat adalah Secret
metadata:
  name: mongo-secret         # Nama Secret, dirujuk oleh StatefulSet MongoDB dan Deployment backend
  labels:
    app: mongo               # Label penanda bahwa Secret ini bagian dari komponen mongo
type: Opaque                 # Tipe Opaque = Secret generik berisi pasangan key-value bebas
data:
  # Username root MongoDB: "admin" (di-encode base64 sesuai ketentuan Secret)
  MONGO_ROOT_USERNAME: YWRtaW4=
  # Password root MongoDB: "supersecretpassword" (di-encode base64 sesuai ketentuan Secret)
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==

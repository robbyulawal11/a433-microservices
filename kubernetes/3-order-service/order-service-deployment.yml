# Versi API Kubernetes yang digunakan untuk resource Deployment
apiVersion: apps/v1
# Jenis resource yang dibuat, yakni Deployment
kind: Deployment
# Metadata berisi identitas resource
metadata:
  # Nama Deployment untuk order service
  name: order-service
  # Namespace tempat Deployment ini berada
  namespace: ecommerce
  # Label untuk menandai resource ini
  labels:
    app: order-service
# Spesifikasi Deployment
spec:
  # Jumlah replika pod order service yang dijalankan
  replicas: 1
  # Selector untuk mencocokkan pod yang dikelola Deployment ini
  selector:
    # Pod yang dikelola adalah pod dengan label app=order-service
    matchLabels:
      app: order-service
  # Template pod yang akan dibuat oleh Deployment
  template:
    # Metadata pod
    metadata:
      # Label pod agar cocok dengan selector di atas dan selector pada service
      labels:
        app: order-service
      # Anotasi tambahan untuk pod
      annotations:
        # Mengecualikan trafik keluar ke port 5672 (AMQP) dari pengalihan sidecar Istio
        # agar koneksi ke RabbitMQ (termasuk dari init container) berjalan langsung tanpa lewat proxy Envoy
        traffic.sidecar.istio.io/excludeOutboundPorts: "5672"
    # Spesifikasi container di dalam pod
    spec:
      # Init container untuk memastikan RabbitMQ sudah siap sebelum order service dijalankan
      # (implementasi tips: RabbitMQ harus di-deploy dan siap terlebih dahulu)
      initContainers:
          # Nama init container penunggu RabbitMQ
        - name: wait-for-rabbitmq
          # Menggunakan image busybox yang ringan karena hanya butuh perintah nc (netcat)
          image: busybox:1.36
          # Perintah looping: cek koneksi TCP ke rabbitmq:5672 setiap 2 detik sampai berhasil
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo menunggu rabbitmq; sleep 2; done"]
      # Daftar container utama di dalam pod
      containers:
          # Nama container order service
        - name: order-service
          # Container image order service yang diambil dari GitHub Packages (bukan local image)
          image: ghcr.io/robbyulawal11/order-service:latest
          # Selalu tarik image terbaru dari registry setiap pod dibuat
          imagePullPolicy: Always
          # Daftar port yang dibuka oleh container
          ports:
              # Port 3000 sesuai ketentuan untuk order service
            - containerPort: 3000
          # Environment variable untuk container (meng-override nilai pada berkas .env)
          env:
              # Port HTTP server order service
            - name: PORT
              value: "3000"
              # Alamat RabbitMQ server; "rabbitmq" adalah nama Kubernetes Service milik RabbitMQ
            - name: AMQP_URL
              value: "amqp://rabbitmq:5672"
